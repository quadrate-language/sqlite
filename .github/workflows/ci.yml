name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build against the current compiler
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - name: Install packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang git libclang-rt-dev \
            libssl-dev llvm-dev meson ninja-build patchelf pkg-config \
            python3 zlib1g-dev \
            libsqlite3-dev

      - uses: actions/checkout@v5
        with:
          path: module

      # No release tarballs are published yet, so the compiler is built from
      # source. This is the whole point of the job: nothing else checks that this
      # module still compiles against a compiler that has moved on.
      - name: Check out and build the compiler
        run: |
          git clone --depth 1 https://github.com/quadrate-language/quadrate.git
          git config --global --add safe.directory "$PWD/quadrate"
          make -C quadrate release

      - name: Format check
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          cd module && quadfmt -c .

      - name: Lint
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          cd module && quadlint .

      # The module resolves by its declared name ("sqlite"), not by the repository
      # directory, so stage it under that name before running its tests.
      - name: Test
        run: |
          export PATH="$PWD/quadrate/dist/bin:$PATH"
          mkdir -p mods/sqlite
          cp module/*.qd module/qd.json mods/sqlite/
          export QUADRATE_ROOT="$PWD/mods"
          cd module && quad test sqlite_test.qd
